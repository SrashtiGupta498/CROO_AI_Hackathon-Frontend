  <g fill="none" stroke="#DCE5DD" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="11.4" stroke-width="1.3" opacity="0.5"/>
    <path d="M16 23.4C11.2 20 11.2 13.2 16 8.8C20.8 13.2 20.8 20 16 23.4Z" stroke-width="1.7"/>
    <path d="M16 22.4V10.6" stroke-width="1.3"/>
  </g>
</svg>
