<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Aura & Earth. Same figure as src/components/Logo.tsx (AuraMark) — keep
       the two in sync. Tuned for tab size: solid ivory tile so the mark keeps
       its contrast on both light and dark browser chrome, and the faint outer
       halo is dropped because it turns to mud below 32px. -->
