# Render Blueprint for CROO_AI_Hackathon-Frontend
# The Vite + React single-page app lives in the `aura/` subfolder, so the static
# site sets `rootDir: aura`. staticPublishPath is relative to that.
#
# VITE_API_URL and GEMINI_API_KEY are read at BUILD time (Vite inlines them into
# the bundle), so changing either requires a rebuild. Both are `sync: false` so
# Render prompts for them on first apply — nothing sensitive is committed.

services:
  - type: web
    name: croo-blog-frontend
    runtime: static
    rootDir: aura
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Deployed backend ORIGIN, no trailing /v1, e.g.
      # https://croo-blog-api.onrender.com
      - key: VITE_API_URL
        sync: false
      # Baked into the client bundle — use a restricted/rotatable key.
      - key: GEMINI_API_KEY
        sync: false
    # SPA fallback. The app uses HashRouter so deep links already resolve to
    # index.html, but this keeps any non-hash path working too.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
